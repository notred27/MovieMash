version: '3.8'

services:
  php:
    build:
      context: .
    container_name: php_server
    ports:
      - "8080:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_server
    environment:
      MYSQL_ROOT_PASSWORD: password123!
      MYSQL_DATABASE: moviemingle
      MYSQL_USER: guest
      MYSQL_PASSWORD: password123!
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d

volumes:
  db_data: